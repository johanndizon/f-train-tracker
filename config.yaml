# =============================================================================
# F Train Monitor — Combined Configuration
# =============================================================================
# Two independent features, each with its own on/off switch and schedule.
# =============================================================================

# --- Station ─────────────────────────────────────────────────────────────────

station_stop_id: "F16"
station_name: "East Broadway"
primary_route: "F"

# --- Discord ─────────────────────────────────────────────────────────────────

# Role ID to @mention. Leave "" for no ping.
# (Developer Mode → right-click role → Copy Role ID)
discord_role_id: "1555420586153345104"

# =============================================================================
# FEATURE 1 — Train Tracker (ETA countdown)
# =============================================================================
# Sends a ping when an F train is within a set number of minutes of the
# station. Useful for timing your walk to the platform.

train_tracker:
  enabled: false

  # "uptown" (Queens-bound), "downtown" (Brooklyn-bound), or "both"
  direction: "both"

  # Alert when a train is ≤ this many minutes away
  alert_threshold_minutes: 5

  # When to send ETA alerts (Eastern Time, 24-hour format)
  time_windows:
    - days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
      start_time: "07:00"
      end_time: "09:30"
    - days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
      start_time: "17:00"
      end_time: "19:30"

# =============================================================================
# FEATURE 2 — Service Alerts (delays, disruptions, reroutes)
# =============================================================================
# Monitors for delays, suspensions, service changes, planned work, and
# non-F trains being rerouted through the station.

service_alerts:
  enabled: true

  # MTA service alerts (delays, suspensions, planned work, detours, etc.)
  delays_and_alerts: true

  # Detect non-F trains stopping at East Broadway (reroutes)
  unusual_routes: true

  # Routes to exclude from unusual train alerts (e.g. FX is the peak-hour F Express)
  ignored_unusual_routes: ["FX"]

  # How strictly to filter alerts:
  #   "station_only"      — Only alerts that specifically reference East Broadway
  #                         in their data. Strictest, cuts out noise from other
  #                         parts of the F line. (recommended)
  #   "line_and_station"  — Alerts that reference East Broadway, OR system-wide
  #                         F train alerts that don't specify any particular stops.
  #   "entire_line"       — Any alert mentioning the F train, anywhere on the line.
  #                         Noisiest.
  filter_mode: "line_and_station"

  # When to check for disruptions (typically broader than commute windows)
  time_windows:
    - days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
      start_time: "08:00"
      end_time: "23:59"
    - days: ["saturday", "sunday"]
      start_time: "10:00"
      end_time: "23:59"
